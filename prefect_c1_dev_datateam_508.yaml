name: mdb-updates-c1-dev
prefect-version: 3.3.4

pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    branch: datateam-508-data-cleanup
    repository: https://github.com/CBIIT/bento-mdb.git
- prefect.deployments.steps.run_shell_script:
    id: install-dependencies
    script: sh -c "cd bento-mdb-main && uv pip install --system ."
- prefect.deployments.steps.run_shell_script:
    id: install-aws-cli
    script: sh -c "apt-get update && apt-get install -y --no-install-recommends curl unzip && cd /tmp && curl 'https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip' -o 'awscliv2.zip' && unzip awscliv2.zip && ./aws/install --update && curl 'https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb' -o 'session-manager-plugin.deb' && dpkg -i session-manager-plugin.deb && apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/awscliv2.zip /tmp/aws/ /tmp/session-manager-plugin.deb"

deployments:
- name: liquibase-update-datateam-508
  version:
  tags: []
  concurrency_limit:
  description: Update the Neo4j database.
  entrypoint: src/bento_mdb/flows/update_mdb.py:liquibase_update_flow
  parameters: {}
  schedule: null
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: liquibase-queue
    job_variables: {}
- name: run-cypher-datateam-508
  version:
  tags: []
  concurrency_limit:
  description: Run arbitrary Cypher queries on MDB.
  entrypoint: src/bento_mdb/flows/run_cypher.py:run_cypher_flow
  parameters: {}
  schedule: null
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name:
    job_variables: {}
