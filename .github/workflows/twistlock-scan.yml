name: Twistlock Scan (Prefect)

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which account the ECR repository is in"
        type: choice
        default: fnl-leidos
        options:
          - fnl-leidos
          - ECR-cbiit-cloudone
      image_tag:
        description:
          ECR tag that already exists (e.g. from a completed "Build STS Image" run). Strongly recommended on feature branches.
          Leave empty to compute from git like Build STS (branch name + tag counter) — that tag must already be pushed to ECR or pull will fail.
        required: false
        default: ""
        type: string
      scan_target:
        description: "Which image (same URIs as Build STS push)"
        type: choice
        default: fast-api
        options:
          - fast-api
          - sts
          - both
      twistlock_address:
        description: "Optional Twistlock console URL for Prefect params"
        required: false
        default: ""
        type: string
      twistcli_skip_download:
        description: "Passed to Prefect flow (worker uses PATH twistcli)"
        required: false
        type: boolean
        default: false

run-name: "Twistlock ${{ inputs.scan_target }} (${{ inputs.environment }})"

jobs:
  twistlock-scan:
    name: Pull from ECR and trigger Twistlock
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
        ECR_REPOSITORY: crdc-mdb-sts
        ECR_STS_REPOSITORY: crdc-mdb-sts-fast-api
        REGION: "us-east-1"
        AWS_BUILD_ROLE_TO_ASSUME: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
#       ref: ${{ env.CODE_BRANCH }}
#       ref: ${{ github.ref_name }}
          submodules: true

      - name: Extract branch name and set tag image
        id: extract_branch
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$MANUAL_IMAGE_TAG" ]; then
            echo "IMAGE_TAG=$MANUAL_IMAGE_TAG" >> $GITHUB_ENV
            echo "Using workflow input image_tag=$MANUAL_IMAGE_TAG"
            exit 0
          fi
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          if  [ ! -z "$tag" ];
          then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
            echo "IMAGE_TAG=$BRANCH_NAME.$build_num" >> $GITHUB_ENV
          else
            build_num=1
            echo "IMAGE_TAG=$BRANCH_NAME.$build_num" >> $GITHUB_ENV
          fi

      - name: Set STS image names
        run: |
          echo "STS_IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
          echo "STS_FAST_API_IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_STS_REPOSITORY}}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Configure AWS Role to assume using OIDC authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        env:
          REGISTRY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        run:  |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Verify image tag exists in ECR
        id: verify-ecr
        env:
          SCAN_TARGET: ${{ inputs.scan_target }}
          AWS_REGION_USE: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          TAG="${IMAGE_TAG:?}"
          REG="${AWS_REGION_USE}"
          HINT='Complete workflow "Build STS Image" on this branch (same environment) first so the image is pushed, then re-run; or set workflow input image_tag to a tag you know exists in ECR.'

          check_repo() {
            local repo="$1"
            if ! aws ecr describe-images \
              --repository-name "$repo" \
              --image-ids "imageTag=${TAG}" \
              --region "$REG" \
              --output text >/dev/null 2>&1; then
              echo "::error title=ECR image missing::No manifest for ${repo}:${TAG}. ${HINT}"
              exit 1
            fi
            echo "Verified ECR: ${repo}:${TAG}"
          }

          case "$SCAN_TARGET" in
            fast-api) check_repo crdc-mdb-sts-fast-api ;;
            sts) check_repo crdc-mdb-sts ;;
            both)
              check_repo crdc-mdb-sts-fast-api
              check_repo crdc-mdb-sts
              ;;
            *) echo "Unknown scan_target"; exit 1 ;;
          esac

      - name: Pull image(s) from ECR
        id: pull-ecr
        env:
          SCAN_TARGET: ${{ inputs.scan_target }}
        run: |
          set -euo pipefail
          case "$SCAN_TARGET" in
            fast-api)
              echo "Pulling $STS_FAST_API_IMAGE_NAME"
              docker pull "$STS_FAST_API_IMAGE_NAME"
              ;;
            sts)
              echo "Pulling $STS_IMAGE_NAME"
              docker pull "$STS_IMAGE_NAME"
              ;;
            both)
              docker pull "$STS_FAST_API_IMAGE_NAME"
              docker pull "$STS_IMAGE_NAME"
              ;;
            *) exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.10"

      - name: Install Prefect CLI
        run: uv pip install --system "prefect==3.3.4"

      - name: Run Twistlock scan deployment (STS FAST API image)
        id: prefect-twistlock-fast-api
        if: ${{ inputs.scan_target == 'fast-api' || inputs.scan_target == 'both' }}
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          TWISTLOCK_ADDRESS: ${{ inputs.twistlock_address }}
          TWISTCLI_SKIP_DOWNLOAD: ${{ inputs.twistcli_skip_download }}
        run: |
          set -euo pipefail
          IMAGE_REF="$STS_FAST_API_IMAGE_NAME"
          if [ -n "${TWISTLOCK_ADDRESS:-}" ]; then
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --arg twistlock_address "$TWISTLOCK_ADDRESS" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              '{image_ref: $image_ref, twistlock_address: $twistlock_address, twistcli_skip_download: $twistcli_skip_download}')
          else
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              '{image_ref: $image_ref, twistcli_skip_download: $twistcli_skip_download}')
          fi
          echo "PARAMS=$PARAMS"
          prefect deployment run twistlock-scan/twistlock-scan \
            --params "$PARAMS" \
            --watch \
            --watch-interval 30

      - name: Run Twistlock scan deployment (STS image)
        id: prefect-twistlock-sts
        if: ${{ inputs.scan_target == 'sts' || inputs.scan_target == 'both' }}
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          TWISTLOCK_ADDRESS: ${{ inputs.twistlock_address }}
          TWISTCLI_SKIP_DOWNLOAD: ${{ inputs.twistcli_skip_download }}
        run: |
          set -euo pipefail
          IMAGE_REF="$STS_IMAGE_NAME"
          if [ -n "${TWISTLOCK_ADDRESS:-}" ]; then
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --arg twistlock_address "$TWISTLOCK_ADDRESS" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              '{image_ref: $image_ref, twistlock_address: $twistlock_address, twistcli_skip_download: $twistcli_skip_download}')
          else
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              '{image_ref: $image_ref, twistcli_skip_download: $twistcli_skip_download}')
          fi
          echo "PARAMS=$PARAMS"
          prefect deployment run twistlock-scan/twistlock-scan \
            --params "$PARAMS" \
            --watch \
            --watch-interval 30

