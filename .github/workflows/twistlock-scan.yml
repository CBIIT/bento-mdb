name: Twistlock Scan (Prefect)

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which account the ECR repository is in"
        type: choice
        default: ECR-cbiit-cloudone
        options:
          - fnl-leidos
          - ECR-cbiit-cloudone
      image_tag:
        description:
          Optional. Pin IMAGE_TAG for build/push (must not collide with existing git tags if reused).
          Leave empty to use the same branch/tag logic as Build STS Image.
        required: false
        default: ""
        type: string
      trivy_scan:
        description: "Run Trivy on fast-api image before git tag (same as Build STS)"
        type: boolean
        required: true
        default: true
      scan_target:
        description: "Which image to scan via Prefect after push"
        type: choice
        default: fast-api
        options:
          - fast-api
          - sts
          - both
      twistlock_address:
        description: "Optional Twistlock console URL for Prefect params"
        required: false
        default: ""
        type: string
      twistcli_skip_download:
        description: "Legacy param (registry API mode ignores this)"
        required: false
        type: boolean
        default: false
      twistlock_poll_timeout_seconds:
        description: "Prefect flow poll_timeout_seconds (Twistlock registry queue)"
        required: false
        default: "1800"
        type: string
      twistlock_notify_defenders:
        description: "POST registry/scan/select after enqueue (ping scanner defenders)"
        required: false
        type: boolean
        default: true

run-name: "Twistlock ${{ inputs.scan_target }} (${{ inputs.environment }}, Trivy ${{ inputs.trivy_scan }})"

jobs:
  twistlock-scan:
    name: Build, push to ECR, Twistlock via Prefect
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
        ECR_REPOSITORY: crdc-mdb-sts
        ECR_STS_REPOSITORY: crdc-mdb-sts-fast-api
        REGION: "us-east-1"
        AWS_BUILD_ROLE_TO_ASSUME: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
#       ref: ${{ env.CODE_BRANCH }}
#       ref: ${{ github.ref_name }}
          submodules: true

      - name: Extract branch name and set tag image
        id: extract_branch
        env:
          MANUAL_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$MANUAL_IMAGE_TAG" ]; then
            echo "IMAGE_TAG=$MANUAL_IMAGE_TAG" >> $GITHUB_ENV
            echo "Using workflow input image_tag=$MANUAL_IMAGE_TAG"
            exit 0
          fi
          BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "branch=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "Current branch is: $BRANCH_NAME"
          git fetch --tags --force --quiet
          tag=$(git tag -l $BRANCH_NAME* | sort -V | tail -1)
          if  [ ! -z "$tag" ];
          then
            build_num=$(echo "${tag##*.}")
            build_num=$((build_num+1))
            echo "IMAGE_TAG=$BRANCH_NAME.$build_num" >> $GITHUB_ENV
          else
            build_num=1
            echo "IMAGE_TAG=$BRANCH_NAME.$build_num" >> $GITHUB_ENV
          fi

      - name: Set STS image names
        run: |
          echo "STS_IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV
          echo "STS_FAST_API_IMAGE_NAME=${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_STS_REPOSITORY}}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      # --- Same as Build STS Image (docker build + tag + push) ---
      - name: Build STS image
        id: build-image
        env:
          ECR_REPOSITORY: "crdc-mdb-sts"
          REGION: "us-east-1"
          AWS_BUILD_ROLE_TO_ASSUME: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}
          AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
          REGISTRY_URL: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          STS_IMAGE_NAME: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}
        run: |
          cd devops/dockerfiles/sts/ && docker build -t $STS_IMAGE_NAME .

      - name: Build STS FAST API image
        id: build-sts-fast-api-image
        env:
          ECR_STS_REPOSITORY: crdc-mdb-sts-fast-api
          REGION: "us-east-1"
          AWS_BUILD_ROLE_TO_ASSUME: ${{ secrets.AWS_BUILD_ROLE_TO_ASSUME }}
          AWS_ECR_ACCOUNT_ID: ${{ secrets.AWS_ECR_ACCOUNT_ID }}
          REGISTRY_URL: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          STS_FAST_API_IMAGE_NAME: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_STS_REPOSITORY}}:${{ env.IMAGE_TAG }}
        run: |
          docker build --no-cache -t $STS_FAST_API_IMAGE_NAME -f devops/dockerfiles/sts-fast-api/Dockerfile .

      - name: Run Trivy vulnerability scanner
        id: trivy-fast-api-scan
        if: github.event.inputs.trivy_scan == 'true'
        env:
          REGISTRY_URL: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          STS_FAST_API_IMAGE_NAME: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_STS_REPOSITORY}}:${{ env.IMAGE_TAG }}
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.STS_FAST_API_IMAGE_NAME }}'
          format: 'table'
          exit-code: 1
          severity: 'CRITICAL,HIGH'

      - name: Create git tag for image
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${{ env.IMAGE_TAG }}
          git push origin ${{ env.IMAGE_TAG }}

      - name: Configure AWS Role to assume using OIDC authentication
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: login-ecr
        env:
          REGISTRY_URL: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
        run:  |
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REGISTRY_URL

      - name: Push STS docker Image
        if: success()
        env:
          ECR_REPOSITORY: "crdc-mdb-sts"
          REGISTRY_URL: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com
          STS_IMAGE_NAME: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY}}:${{ env.IMAGE_TAG }}
        run: |
          echo "Pushing: $STS_IMAGE_NAME"
          docker push $STS_IMAGE_NAME

      - name: Push STS FAST API docker Image
        if: success()
        env:
          ECR_STS_REPOSITORY: "crdc-mdb-sts-fast-api"
          REGISTRY_URL: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ env.REGION }}.amazonaws.com
          STS_FAST_API_IMAGE_NAME: ${{ secrets.AWS_ECR_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.ECR_STS_REPOSITORY}}:${{ env.IMAGE_TAG }}
        run: |
          echo "Pushing: $STS_FAST_API_IMAGE_NAME"
          docker push $STS_FAST_API_IMAGE_NAME

      # Registry round-trip check (no ecr:DescribeImages — build role often lacks that permission).
      - name: Pull image(s) from ECR
        id: pull-ecr
        env:
          SCAN_TARGET: ${{ inputs.scan_target }}
        run: |
          set -euo pipefail
          case "$SCAN_TARGET" in
            fast-api)
              echo "Pulling $STS_FAST_API_IMAGE_NAME"
              docker pull "$STS_FAST_API_IMAGE_NAME"
              ;;
            sts)
              echo "Pulling $STS_IMAGE_NAME"
              docker pull "$STS_IMAGE_NAME"
              ;;
            both)
              docker pull "$STS_FAST_API_IMAGE_NAME"
              docker pull "$STS_IMAGE_NAME"
              ;;
            *) exit 1 ;;
          esac

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.10"

      - name: Install Prefect CLI
        run: uv pip install --system "prefect==3.3.4"

      - name: Run Twistlock scan deployment (STS FAST API image)
        id: prefect-twistlock-fast-api
        if: ${{ inputs.scan_target == 'fast-api' || inputs.scan_target == 'both' }}
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
          TWISTLOCK_ADDRESS: ${{ inputs.twistlock_address }}
          TWISTCLI_SKIP_DOWNLOAD: ${{ inputs.twistcli_skip_download }}
          POLL_TIMEOUT: ${{ inputs.twistlock_poll_timeout_seconds }}
          NOTIFY_DEFENDERS: ${{ inputs.twistlock_notify_defenders }}
        run: |
          set -euo pipefail
          IMAGE_REF="$STS_FAST_API_IMAGE_NAME"
          if [ -n "${TWISTLOCK_ADDRESS:-}" ]; then
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --arg twistlock_address "$TWISTLOCK_ADDRESS" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              --argjson poll_timeout_seconds "$POLL_TIMEOUT" \
              --argjson notify_registry_defenders "$NOTIFY_DEFENDERS" \
              '{image_ref: $image_ref, twistlock_address: $twistlock_address, twistcli_skip_download: $twistcli_skip_download, poll_timeout_seconds: ($poll_timeout_seconds | tonumber), notify_registry_defenders: $notify_registry_defenders}')
          else
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              --argjson poll_timeout_seconds "$POLL_TIMEOUT" \
              --argjson notify_registry_defenders "$NOTIFY_DEFENDERS" \
              '{image_ref: $image_ref, twistcli_skip_download: $twistcli_skip_download, poll_timeout_seconds: ($poll_timeout_seconds | tonumber), notify_registry_defenders: $notify_registry_defenders}')
          fi
          echo "PARAMS=$PARAMS"
          prefect deployment run twistlock-scan/twistlock-scan \
            --params "$PARAMS" \
            --watch \
            --watch-interval 30

      - name: Run Twistlock scan deployment (STS image)
        id: prefect-twistlock-sts
        if: ${{ inputs.scan_target == 'sts' || inputs.scan_target == 'both' }}
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
          TWISTLOCK_ADDRESS: ${{ inputs.twistlock_address }}
          TWISTCLI_SKIP_DOWNLOAD: ${{ inputs.twistcli_skip_download }}
          POLL_TIMEOUT: ${{ inputs.twistlock_poll_timeout_seconds }}
          NOTIFY_DEFENDERS: ${{ inputs.twistlock_notify_defenders }}
        run: |
          set -euo pipefail
          IMAGE_REF="$STS_IMAGE_NAME"
          if [ -n "${TWISTLOCK_ADDRESS:-}" ]; then
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --arg twistlock_address "$TWISTLOCK_ADDRESS" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              --argjson poll_timeout_seconds "$POLL_TIMEOUT" \
              --argjson notify_registry_defenders "$NOTIFY_DEFENDERS" \
              '{image_ref: $image_ref, twistlock_address: $twistlock_address, twistcli_skip_download: $twistcli_skip_download, poll_timeout_seconds: ($poll_timeout_seconds | tonumber), notify_registry_defenders: $notify_registry_defenders}')
          else
            PARAMS=$(jq -n \
              --arg image_ref "$IMAGE_REF" \
              --argjson twistcli_skip_download "$TWISTCLI_SKIP_DOWNLOAD" \
              --argjson poll_timeout_seconds "$POLL_TIMEOUT" \
              --argjson notify_registry_defenders "$NOTIFY_DEFENDERS" \
              '{image_ref: $image_ref, twistcli_skip_download: $twistcli_skip_download, poll_timeout_seconds: ($poll_timeout_seconds | tonumber), notify_registry_defenders: $notify_registry_defenders}')
          fi
          echo "PARAMS=$PARAMS"
          prefect deployment run twistlock-scan/twistlock-scan \
            --params "$PARAMS" \
            --watch \
            --watch-interval 30

