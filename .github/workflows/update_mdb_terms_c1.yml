name: Update Cloud-One-MDB-DEV Terms
permissions:
  contents: read

on:
  workflow_run:
    workflows: ["Trigger Term Updates Changelog"]
    types: [completed]
  workflow_dispatch:
    inputs:
      author:
        description: "Author name for changes"
        required: false
        default: "GitHub Actions"
      commit_sha:
        description: "Commit SHA for reference"
        required: false
        default: ""
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false

jobs:
  collect-changelogs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changelog_files: ${{ steps.find-changelogs.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Find committed changelog files
        id: find-changelogs
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # Find term changelog XML files committed after the triggering commit
          # HEAD_SHA is the commit that started the generate workflow;
          # changelog files are in newer commits made by that workflow
          RAW_CHANGELOGS=$(git log "${HEAD_SHA}..HEAD" --name-only --pretty=format: | \
            grep 'data/output/term_changelogs/.*\.xml' || true)
          
          if [ -z "$RAW_CHANGELOGS" ]; then
            CHANGELOGS='[]'
          else
            CHANGELOGS=$(printf '%s\n' "$RAW_CHANGELOGS" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          fi
          
          echo "changelog_files=$CHANGELOGS" >> $GITHUB_OUTPUT
          echo "Found changelogs: $CHANGELOGS"

  update-c1-mdb-dev:
    needs: collect-changelogs
    if: ${{ needs.collect-changelogs.outputs.changelog_files != '' && needs.collect-changelogs.outputs.changelog_files != '[]' }}
    uses: ./.github/workflows/update_mdb.yml
    secrets:
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
    with:
      mdb_id: cloud-one-mdb-dev
      changelog_files: ${{ needs.collect-changelogs.outputs.changelog_files }}
      dry_run: ${{ fromJson(github.event.inputs.dry_run || 'false') }}
      log_level: ${{ github.event.inputs.log_level || 'info' }}

  clear-sts-dev-cache:
    needs: [collect-changelogs, update-c1-mdb-dev]
    if: ${{ needs.collect-changelogs.outputs.changelog_files != '' && needs.collect-changelogs.outputs.changelog_files != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Clear STS DEV cache
        run: |
          set -xeuo pipefail
          RESPONSE=$(curl -sS -f http://sts-dev.cancer.gov/admin/cache/clear)
          echo "STS DEV cache clear response: $RESPONSE"
          echo "$RESPONSE" | jq -e '.status == "cache cleared"' >/dev/null

  slack-notification:
    needs: [collect-changelogs, update-c1-mdb-dev, clear-sts-dev-cache]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.collect-changelogs.result == 'failure' || needs.update-c1-mdb-dev.result == 'failure' || needs.clear-sts-dev-cache.result == 'failure' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')) && 'failure' || 'success' }}
          message: |
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|*[CloudOne] Term Update*>
            ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') && '⚠️ Upstream workflow failed' || (needs.collect-changelogs.result == 'failure' || needs.update-c1-mdb-dev.result == 'failure' || needs.clear-sts-dev-cache.result == 'failure') && 'Failure' || 'Success' }}
