name: Update Cloud-One-MDB-DEV Models

permissions:
  contents: read
  actions: write

on:
  workflow_run:
    workflows: ["Trigger Model Updates Changelogs"]
    types: [completed]
  workflow_dispatch:
    inputs:
      models_spec_path:
        description: "Path to YAML files with models & refs their MDFs."
        required: false
        default: "config/mdb_models.yml"
      model:
        description: "Specific model handle to process"
        required: false
        default: ""
      version:
        description: "Specific version to process"
        required: false
        default: ""
      mdf_files:
        description: "Path or URL to specific MDF files to process"
        required: false
        default: ""
      datahub_only:
        description: "Only include datahub models"
        required: false
        type: boolean
        default: false
      mdb_id:
        description: "ID of MDB to update"
        required: false
        type: string
        default: "cloud-one-mdb-dev"
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false

jobs:
  collect-changelogs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changelog_files: ${{ steps.find-changelogs.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Read S3 keys from upload log
        id: find-changelogs
        env:
          RUN_ID: ${{ github.event.workflow_run.id || github.run_id }}
        run: |
          LOG_LINE=$(git log --format=%s | grep "s3-upload-log run=${RUN_ID}" || true)
          if [ -n "$LOG_LINE" ]; then
            CHANGELOGS=$(echo "$LOG_LINE" | grep -oP 'keys=\K\[.*\]')
          else
            echo "Warning: No s3-upload-log commit found for run ${RUN_ID}"
            CHANGELOGS='[]'
          fi
          echo "changelog_files=$CHANGELOGS" >> $GITHUB_OUTPUT
          echo "Found changelogs: $CHANGELOGS"

  update-c1-mdb-dev:
    needs: collect-changelogs
    if: ${{ needs.collect-changelogs.outputs.changelog_files != '' && needs.collect-changelogs.outputs.changelog_files != '[]' }}
    uses: ./.github/workflows/update_mdb.yml
    secrets:
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
      AWS_CHANGELOG_ROLE_ARN: ${{ secrets.AWS_CHANGELOG_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_CHANGELOG_BUCKET: ${{ secrets.S3_CHANGELOG_BUCKET }}
    with:
      mdb_id: cloud-one-mdb-dev
      changelog_files: ${{ needs.collect-changelogs.outputs.changelog_files }}
      dry_run: ${{ fromJson(github.event.inputs.dry_run || 'false') }}
      log_level: ${{ github.event.inputs.log_level || 'info' }}

