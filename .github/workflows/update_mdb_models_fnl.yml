name: Update FNL-MDB-DEV Models

permissions:
  contents: read
  actions: write

on:
  workflow_run:
    workflows: ["Generate Model Updates Changelogs"]
    types: [completed]
  workflow_dispatch:
    inputs:
      models_spec_path:
        description: "Path to YAML files with models & refs their MDFs."
        required: false
        default: "config/mdb_models.yml"
      model:
        description: "Specific model handle to process"
        required: false
        default: ""
      version:
        description: "Specific version to process"
        required: false
        default: ""
      mdf_files:
        description: "Path or URL to specific MDF files to process"
        required: false
        default: ""
      datahub_only:
        description: "Only include datahub models"
        required: false
        type: boolean
        default: false
      mdb_id:
        description: "ID of MDB to update"
        required: false
        type: string
        default: "fnl-mdb-dev"
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false

jobs:
  collect-changelogs:
    runs-on: ubuntu-latest
    outputs:
      changelog_files: ${{ steps.find-changelogs.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Find committed changelog files
        id: find-changelogs
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Find all changelog XML files in the commit that triggered this workflow
          CHANGELOGS=$(git log -1 --name-only --pretty=format: "$HEAD_SHA" | \
            grep 'data/output/model_changelogs/.*\.xml' | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          echo "changelog_files=$CHANGELOGS" >> $GITHUB_OUTPUT
          echo "Found changelogs: $CHANGELOGS"

  update-fnl-mdb-dev:
    needs: collect-changelogs
    if: ${{ needs.collect-changelogs.outputs.changelog_files != '' && needs.collect-changelogs.outputs.changelog_files != '[]' }}
    uses: ./.github/workflows/update_mdb.yml
    secrets:
      PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
      PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
    with:
      mdb_id: fnl-mdb-dev
      changelog_files: ${{ needs.collect-changelogs.outputs.changelog_files }}
      dry_run: ${{ fromJson(github.event.inputs.dry_run || 'false') }}
      log_level: ${{ github.event.inputs.log_level || 'info' }}

  slack-notification:
    needs: [collect-changelogs, update-fnl-mdb-dev]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.collect-changelogs.result == 'failure' || needs.update-fnl-mdb-dev.result == 'failure') && 'failure' || 'success' }}
          message: |
            ${{ needs.collect-changelogs.result == 'success' && '✔️' || needs.collect-changelogs.result == 'failure' && '❌' || '⊘' }} collect-changelogs
            ${{ needs.update-fnl-mdb-dev.result == 'success' && '✔️' || needs.update-fnl-mdb-dev.result == 'failure' && '❌' || '⊘' }} update-fnl-mdb-dev
