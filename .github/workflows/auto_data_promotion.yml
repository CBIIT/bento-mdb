name: Data Promotion (Dev to QA)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *" # runs daily at 1:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -xeuo pipefail
          MODELS=$(check_promotion detect-updated --format space 2>/dev/null || true)
          if [ -z "$MODELS" ]; then
            echo "No updated models detected."
            echo "model_filters=" >> $GITHUB_OUTPUT
          else
            echo "Updated models: $MODELS"
            FILTERS=$(for m in $MODELS; do printf -- '--models-filter %s ' "$m"; done)
            echo "model_filters=$FILTERS" >> $GITHUB_OUTPUT
          fi

  check-dev-mdf-sync:
    needs: detect-updated-models
    if: ${{ needs.detect-updated-models.outputs.model_filters != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 0 — Confirm DEV is in sync with MDF
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          check_promotion check-dev ${{ needs.detect-updated-models.outputs.model_filters }}

  export-c1-dev:
    needs: check-dev-mdf-sync
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.export.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Export cloud-one-mdb-dev to S3
        id: export
        run: |
          # TODO: remove for production — skipping actual export for testing
          TODAY=$(TZ="America/New_York" date +"%Y-%m-%d")
          S3_KEY="${TODAY}__cloud-one-mdb-dev.graphml"
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "[TEST] Skipped export. S3 key: $S3_KEY"

  import-to-c1-qa:
    needs: export-c1-dev
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Import to cloud-one-mdb-qa from S3
        run: |
          # TODO: remove for production — skipping actual import for testing
          echo "[TEST] Skipped import. S3 key: ${{ needs.export-c1-dev.outputs.s3_key }}"

  verify-promotion:
    needs: [import-to-c1-qa, detect-updated-models]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.detect-updated-models.outputs.model_filters != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 1 — Confirm QA received all promoted models
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          check_promotion check-qa ${{ needs.detect-updated-models.outputs.model_filters }}

      - name: Check 2 — Confirm DEV and QA are in sync
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          check_promotion check-sync ${{ needs.detect-updated-models.outputs.model_filters }}

      - name: Update last_promoted_sha in sync_status.yml
        env:
          NEW_SHA: ${{ github.sha }}
          # TODO: push to main in production — currently pushing to current branch for testing
          BRANCH: ${{ github.ref_name }}
        run: |
          set -xeuo pipefail
          python -c "
          import yaml, pathlib, os
          p = pathlib.Path('config/sync_status.yml')
          d = yaml.safe_load(p.read_text())
          d.setdefault('promotion', {})['last_promoted_sha'] = os.environ['NEW_SHA']
          p.write_text(yaml.dump(d, default_flow_style=False, sort_keys=False))
          "
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add config/sync_status.yml
          git diff --cached --quiet || git commit -m "chore: update last_promoted_sha to ${NEW_SHA}"
          git push origin HEAD:${BRANCH}

  slack-notification:
    needs: [detect-updated-models, check-dev-mdf-sync, export-c1-dev, import-to-c1-qa, verify-promotion]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.check-dev-mdf-sync.result == 'failure' || needs.export-c1-dev.result == 'failure' || needs.import-to-c1-qa.result == 'failure' || needs.verify-promotion.result == 'failure') && 'failure' || 'success' }}
          message: |
            *Data Promotion: CloudOne Dev → QA*
            ${{ needs.check-dev-mdf-sync.result == 'success' && '✔️' || needs.check-dev-mdf-sync.result == 'failure' && '❌' || '⊘' }} check-dev-mdf-sync (MDF vs MDB-DEV)
            ${{ needs.export-c1-dev.result == 'success' && '✔️' || needs.export-c1-dev.result == 'failure' && '❌' || '⊘' }} export-c1-dev (cloud-one-mdb-dev → S3)
            ${{ needs.import-to-c1-qa.result == 'success' && '✔️' || needs.import-to-c1-qa.result == 'failure' && '❌' || '⊘' }} import-to-c1-qa (S3 → cloud-one-mdb-qa)
            ${{ needs.verify-promotion.result == 'success' && '✔️' || needs.verify-promotion.result == 'failure' && '❌' || needs.verify-promotion.result == 'skipped' && '⊘' || '⊘' }} verify-promotion (MDF vs MDB-QA · MDB-DEV vs MDB-QA)
