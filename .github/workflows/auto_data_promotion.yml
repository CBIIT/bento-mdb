name: Data Promotion (Dev to QA)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 6 * * *" # runs daily at 1:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      # Uses last_promoted_sha from config/sync_status.yml. Run when latest_version or latest_prerelease_* changed for a model.
      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -euo pipefail
          ref=$(grep 'last_promoted_sha:' config/sync_status.yml | sed -E "s/.*last_promoted_sha: *['\"]?([a-f0-9]+)['\"]?.*/\1/" | tr -d ' \r' || true)
          if [ -z "$ref" ]; then
            echo "model_filters=" >> "$GITHUB_OUTPUT"
            echo "No updated models detected (no last_promoted_sha)."
            exit 0
          fi
          # Collect model names that have latest_version or latest_prerelease_commit or latest_prerelease_version changed.
          current=""
          updated=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^@@.*@@[[:space:]]+([A-Za-z0-9_-]+): ]]; then
              current="${BASH_REMATCH[1]}"
            fi
            if [[ -n "$current" ]] && [[ "$line" =~ ^[+-] ]] && [[ "$line" =~ (latest_version:|latest_prerelease_commit:|latest_prerelease_version:) ]]; then
              updated="${updated:+$updated }$current"
              current=""
            fi
          done < <(git diff "$ref..HEAD" -- config/mdb_models.yml 2>/dev/null || true)
          if [ -z "$updated" ]; then
            echo "model_filters=" >> "$GITHUB_OUTPUT"
            echo "No updated models detected (no latest_version / latest_prerelease_* change)."
          else
            arr=$(echo "$updated" | tr ' ' '\n' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "model_filters=$arr" >> "$GITHUB_OUTPUT"
            echo "Updated models: $updated"
          fi

  check-dev-mdf-sync:
    needs: detect-updated-models
    if: ${{ needs.detect-updated-models.outputs.model_filters != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 0 — Confirm DEV is in sync with MDF
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{"stage": "pre", "models_filter": $filters}')
          prefect deployment run 'check-promotion/check-promotion' \
            --params "$PARAMS" \
            --watch

  export-c1-dev:
    needs: check-dev-mdf-sync
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.export.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Export cloud-one-mdb-dev to S3
        id: export
        run: |
          # TODO: remove for production — skipping actual export for testing
          TODAY=$(TZ="America/New_York" date +"%Y-%m-%d")
          S3_KEY="${TODAY}__cloud-one-mdb-dev.graphml"
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "[TEST] Skipped export. S3 key: $S3_KEY"

  import-to-c1-qa:
    needs: export-c1-dev
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Import to cloud-one-mdb-qa from S3
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          S3_KEY="${{ needs.export-c1-dev.outputs.s3_key }}"

          PARAMS=$(jq -n \
            --arg key "$S3_KEY" \
            '{
              "mdb_id": "cloud-one-mdb-qa",
              "bucket": "cloudone-mdb-data",
              "key": $key,
              "clear_db": true
            }')

          echo "Running mdb-import-s3 with params: $PARAMS"

          watch_out=$(
            prefect deployment run mdb-import-s3/mdb-import-s3 \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee import_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" import_watch.log \
            | head -n1 || true
          )
          echo "Import flow run: $RUN_ID"

  verify-promotion:
    needs: [import-to-c1-qa, detect-updated-models]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.detect-updated-models.outputs.model_filters != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 1+2 — Confirm QA received all promoted models and is in sync with DEV
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{"stage": "post", "models_filter": $filters}')
          prefect deployment run 'check-promotion/check-promotion' \
            --params "$PARAMS" \
            --watch

      # last_promoted_sha = SHA of the commit that last changed config/mdb_models.yml.
      # Used by detect-updated to find models whose latest_version changed since then.
      - name: Update last_promoted_sha in sync_status.yml
        env:
          NEW_SHA: ${{ github.sha }}
          # TODO: push to main in production — currently pushing to current branch for testing
          BRANCH: ${{ github.ref_name }}
        run: |
          set -xeuo pipefail
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git checkout -- .
          git pull --rebase origin ${BRANCH}
          python -c "
          import yaml, pathlib, os
          p = pathlib.Path('config/sync_status.yml')
          d = yaml.safe_load(p.read_text())
          d.setdefault('promotion', {})['last_promoted_sha'] = os.environ['NEW_SHA']
          p.write_text(yaml.dump(d, default_flow_style=False, sort_keys=False))
          "
          git add config/sync_status.yml
          git diff --cached --quiet || git commit -m "chore: update last_promoted_sha to ${NEW_SHA}"
          git push origin HEAD:${BRANCH}

  slack-notification:
    needs: [detect-updated-models, check-dev-mdf-sync, export-c1-dev, import-to-c1-qa, verify-promotion]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.detect-updated-models.result == 'failure' || needs.check-dev-mdf-sync.result == 'failure' || needs.export-c1-dev.result == 'failure' || needs.import-to-c1-qa.result == 'failure' || needs.verify-promotion.result == 'failure') && 'failure' || 'success' }}
          message: "<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Data Promotion: CloudOne Dev → QA — ${{ (needs.detect-updated-models.result == 'failure' || needs.check-dev-mdf-sync.result == 'failure' || needs.export-c1-dev.result == 'failure' || needs.import-to-c1-qa.result == 'failure' || needs.verify-promotion.result == 'failure') && 'Failure' || 'Success' }}>"
