name: Data Promotion (Dev to QA)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * *" # runs daily at 3:00 AM EST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: uv sync --all-extras

      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -euo pipefail
          ref=$(grep 'last_promoted_sha:' config/sync_status.yml | sed -E "s/.*last_promoted_sha: *['\"]?([a-f0-9]+)['\"]?.*/\1/" | tr -d ' \r' || true)
          if [ -z "$ref" ]; then
            echo "model_filters=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff=$(git diff "$ref..HEAD" -- config/mdb_models.yml 2>/dev/null || true)
          result=$(echo "$diff" | uv run python -c "
          import sys, json
          from bento_mdb.promotion_detect import parse_diff
          print(json.dumps({'model_filters': parse_diff(sys.stdin.read())}))
          ")
          model_filters=$(echo "$result" | jq -c '.model_filters')
          echo "model_filters=$model_filters"
          echo "model_filters=$model_filters" >> "$GITHUB_OUTPUT"

  check-dev-mdf-sync:
    needs: detect-updated-models
    if: ${{ needs.detect-updated-models.outputs.model_filters != '' && needs.detect-updated-models.outputs.model_filters != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 0 — Confirm DEV is in sync with MDF
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{"stage": "pre", "models_filter": $filters}')
          uv run prefect deployment run 'check-promotion/check-promotion' \
            --params "$PARAMS" \
            --watch

  export-c1-dev:
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.export.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Export cloud-one-mdb-dev to S3
        id: export
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          PARAMS=$(jq -n \
            '{
              "mdb_id": "cloud-one-mdb-dev",
              "bucket": "cloudone-mdb-data"
            }')

          echo "Running mdb-export-s3 with params: $PARAMS"

          watch_out=$(
            uv run prefect deployment run mdb-export-s3/mdb-export-s3 \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee export_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" export_watch.log \
            | head -n1 || true
          )
          echo "Export flow run: $RUN_ID"

          TODAY=$(TZ="America/New_York" date +"%Y-%m-%d")
          S3_KEY="${TODAY}__cloud-one-mdb-dev.graphml"

          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "Generated S3 key: $S3_KEY"

  import-to-c1-qa:
    needs: export-c1-dev
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Import to cloud-one-mdb-qa from S3
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          S3_KEY="${{ needs.export-c1-dev.outputs.s3_key }}"

          PARAMS=$(jq -n \
            --arg key "$S3_KEY" \
            '{
              "mdb_id": "cloud-one-mdb-qa",
              "bucket": "cloudone-mdb-data",
              "key": $key,
              "clear_db": true
            }')

          echo "Running mdb-import-s3 with params: $PARAMS"

          watch_out=$(
            uv run prefect deployment run mdb-import-s3/mdb-import-s3 \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee import_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" import_watch.log \
            | head -n1 || true
          )
          echo "Import flow run: $RUN_ID"

  verify-promotion:
    needs: [import-to-c1-qa, detect-updated-models]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.detect-updated-models.outputs.model_filters != '' && needs.detect-updated-models.outputs.model_filters != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 1+2 — Confirm QA received all promoted models and is in sync with DEV
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{"stage": "post", "models_filter": $filters}')
          uv run prefect deployment run 'check-promotion/check-promotion' \
            --params "$PARAMS" \
            --watch

      # last_promoted_sha = SHA of the commit that last changed config/mdb_models.yml.
      # Used by detect-updated to find models whose latest_version changed since then.
      - name: Update last_promoted_sha in sync_status.yml
        run: |
          set -xeuo pipefail
          export NEW_SHA=$(git log -1 --format=%H -- config/mdb_models.yml)
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          python - << 'PY'
          import yaml, pathlib, os
          p = pathlib.Path('config/sync_status.yml')
          d = yaml.safe_load(p.read_text())
          d.setdefault('promotion', {})['last_promoted_sha'] = os.environ['NEW_SHA']
          p.write_text(yaml.dump(d, default_flow_style=False, sort_keys=False))
          PY
          git add config/sync_status.yml
          git diff --cached --quiet || git commit -m "chore: update last_promoted_sha to ${NEW_SHA}"
          git push origin ${{ github.ref_name }}

  slack-notification:
    needs: [detect-updated-models, check-dev-mdf-sync, export-c1-dev, import-to-c1-qa, verify-promotion]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.detect-updated-models.result == 'failure' || needs.check-dev-mdf-sync.result == 'failure' || needs.export-c1-dev.result == 'failure' || needs.import-to-c1-qa.result == 'failure' || needs.verify-promotion.result == 'failure') && 'failure' || 'success' }}
          message: |
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Data Promotion: CloudOne Dev → QA>
            ${{ (needs.detect-updated-models.result == 'failure' || needs.check-dev-mdf-sync.result == 'failure' || needs.export-c1-dev.result == 'failure' || needs.import-to-c1-qa.result == 'failure' || needs.verify-promotion.result == 'failure') && 'Failure' || 'Success' }}
