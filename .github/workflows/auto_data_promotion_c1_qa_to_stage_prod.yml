name: Data Promotion (CloudOne QA to Stage and Production)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 8 * * *" # runs daily at 3:00 AM EST (8:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket only"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      # Uses last_promoted_sha_stage_prod from config/sync_status.yml (SHA of last commit that changed mdb_models.yml).
      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -euo pipefail
          ref=$(grep 'last_promoted_sha_stage_prod:' config/sync_status.yml | sed -E "s/.*last_promoted_sha_stage_prod: *['\"]?([a-f0-9]+)['\"]?.*/\1/" | tr -d ' \r' || true)
          if [ -z "$ref" ]; then
            echo "model_filters=" >> "$GITHUB_OUTPUT"
            echo "No updated models detected (no last_promoted_sha_stage_prod)."
            exit 0
          fi
          # Parse git diff: model is "updated" if latest_version changed (prerelease fields are ignored).
          current=""
          updated=""
          while IFS= read -r line; do
            if [[ "$line" =~ ^@@.*@@[[:space:]]+([A-Za-z0-9_-]+): ]]; then
              current="${BASH_REMATCH[1]}"
            fi
            if [[ -n "$current" ]] && [[ "$line" =~ ^\+[[:space:]]+latest_version: ]]; then
              updated="${updated:+$updated }$current"
              current=""
            fi
          done < <(git diff "$ref..HEAD" -- config/mdb_models.yml 2>/dev/null || true)
          if [ -z "$updated" ]; then
            echo "model_filters=" >> "$GITHUB_OUTPUT"
            echo "No updated models detected."
          else
            # Build JSON array for Prefect (e.g. ["CDS","CTDC"]).
            arr=$(echo "$updated" | tr ' ' '\n' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "model_filters=$arr" >> "$GITHUB_OUTPUT"
            echo "Updated models: $updated"
          fi