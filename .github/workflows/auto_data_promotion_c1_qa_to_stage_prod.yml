name: Data Promotion (CloudOne QA to Stage and Production)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * 6" # runs weekly on Saturday at 12:00 PM EST (17:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket only"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: uv sync --all-extras

      # Uses last_promoted_sha_stage_prod from config/sync_status.yml.
      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -euo pipefail
          ref=$(grep 'last_promoted_sha_stage_prod:' config/sync_status.yml | sed -E "s/.*last_promoted_sha_stage_prod: *['\"]?([a-f0-9]+)['\"]?.*/\1/" | tr -d ' \r' || true)
          if [ -z "$ref" ]; then
            echo "model_filters=[]" >> "$GITHUB_OUTPUT"
            echo "No updated models detected (no last_promoted_sha_stage_prod)."
            exit 0
          fi
          diff=$(git diff "$ref..HEAD" -- config/mdb_models.yml 2>/dev/null || true)
          result=$(echo "$diff" | uv run python -c "
          import sys, json
          from bento_mdb.promotion_detect import parse_diff
          print(json.dumps({'model_filters': parse_diff(sys.stdin.read(), is_prod_release=True)}))
          ")
          echo "model_filters=$(echo "$result" | jq -c '.model_filters')" >> "$GITHUB_OUTPUT"

  check-qa-ready:
    needs: detect-updated-models
    if: ${{ needs.detect-updated-models.outputs.model_filters != '' && needs.detect-updated-models.outputs.model_filters != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check 0 — Confirm QA is in sync with MDF and DEV
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          # Check 1: MDF vs QA (check_model_qa) - ensures QA has all models from MDF
          # Check 2: DEV vs QA (check_model_sync) - ensures QA is in sync with DEV
          # Using stage="post" performs both checks
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{
              "stage": "post",
              "dev_mdb_id": "cloud-one-mdb-dev",
              "qa_mdb_id": "cloud-one-mdb-qa",
              "models_filter": $filters
            }')
          prefect deployment run 'check-promotion/check-promotion-upper' \
            --params "$PARAMS" \
            --watch

  export-c1-qa:
    needs: check-qa-ready
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.export.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Export cloud-one-mdb-qa to S3
        id: export
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          PARAMS=$(jq -n \
            '{
              "mdb_id": "cloud-one-mdb-qa",
              "bucket": "cloudone-mdb-data"
            }')

          echo "Running mdb-export-s3 with params: $PARAMS"

          watch_out=$(
            prefect deployment run mdb-export-s3/mdb-export-s3-prod \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee export_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" export_watch.log \
            | head -n1 || true
          )
          echo "Export flow run: $RUN_ID"

          TODAY=$(TZ="America/New_York" date +"%Y-%m-%d")
          S3_KEY="${TODAY}__cloud-one-mdb-qa.graphml"

          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "Generated S3 key: $S3_KEY"

  import-to-c1-stage:
    needs: export-c1-qa
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ needs.export-c1-qa.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Import to cloud-one-mdb-stage from S3
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          S3_KEY="${{ needs.export-c1-qa.outputs.s3_key }}"

          PARAMS=$(jq -n \
            --arg key "$S3_KEY" \
            '{
              "mdb_id": "cloud-one-mdb-stage",
              "bucket": "cloudone-mdb-data",
              "key": $key,
              "clear_db": true
            }')

          echo "Running mdb-import-s3 with params: $PARAMS"

          watch_out=$(
            prefect deployment run mdb-import-s3/mdb-import-s3-prod \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee import_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" import_watch.log \
            | head -n1 || true
          )
          echo "Import flow run: $RUN_ID"

  prune-c1-stage:
    needs: import-to-c1-stage
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Prune prerelease from cloud-one-mdb-stage
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n '{"mdb_id": "cloud-one-mdb-stage", "dry_run": false}')
          echo "Running mdb-prune-prerelease with params: $PARAMS"
          prefect deployment run mdb-prune-prerelease/prune-prerelease-prod \
            --params "$PARAMS" \
            --watch

  export-c1-stage:
    needs: prune-c1-stage
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') }}
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ steps.export.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Export cloud-one-mdb-stage to S3
        id: export
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          PARAMS=$(jq -n \
            '{
              "mdb_id": "cloud-one-mdb-stage",
              "bucket": "cloudone-mdb-data"
            }')
          echo "Running mdb-export-s3 (stage) with params: $PARAMS"
          watch_out=$(
            prefect deployment run mdb-export-s3/mdb-export-s3-prod \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee export_watch.log
          )
          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" export_watch.log \
            | head -n1 || true
          )
          echo "Export flow run: $RUN_ID"
          TODAY=$(TZ="America/New_York" date +"%Y-%m-%d")
          S3_KEY="${TODAY}__cloud-one-mdb-stage.graphml"
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "Generated S3 key: $S3_KEY"

  verify-stage-promotion:
    needs: [import-to-c1-stage, export-c1-stage, detect-updated-models]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.detect-updated-models.outputs.model_filters != '' && needs.detect-updated-models.outputs.model_filters != '[]' }}
    runs-on: ubuntu-latest
    outputs:
      s3_key: ${{ needs.export-c1-stage.outputs.s3_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check Stage — Confirm Stage received all promoted models (QA vs Stage)
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          # This checks MDF vs Stage (Check 1) and QA vs Stage (Check 2)
          # Important: Both QA and Stage have the same data from QA export
          # API filters out prerelease versions, so both should be in sync
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{
              "stage": "post",
              "dev_mdb_id": "cloud-one-mdb-qa",
              "qa_mdb_id": "cloud-one-mdb-stage",
              "models_filter": $filters
            }')
          prefect deployment run 'check-promotion/check-promotion-upper' \
            --params "$PARAMS" \
            --watch

  import-to-c1-prod:
    needs: [export-c1-stage, verify-stage-promotion]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.verify-stage-promotion.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Import to cloud-one-mdb-prod from S3
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail

          # Use Stage export key directly from export-c1-stage (pruned data)
          S3_KEY="${{ needs.export-c1-stage.outputs.s3_key }}"

          PARAMS=$(jq -n \
            --arg key "$S3_KEY" \
            '{
              "mdb_id": "cloud-one-mdb-prod",
              "bucket": "cloudone-mdb-data",
              "key": $key,
              "clear_db": true
            }')

          echo "Running mdb-import-s3 with params: $PARAMS (key=$S3_KEY)"

          watch_out=$(
            prefect deployment run mdb-import-s3/mdb-import-s3-prod \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee import_watch.log
          )

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" import_watch.log \
            | head -n1 || true
          )
          echo "Import flow run: $RUN_ID"

  verify-prod-promotion:
    needs: [import-to-c1-prod, detect-updated-models]
    if: ${{ !fromJson(github.event.inputs.dry_run || 'false') && needs.detect-updated-models.outputs.model_filters != '' && needs.detect-updated-models.outputs.model_filters != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Check Production — Confirm Production received all promoted models (MDF vs Prod, QA vs Prod)
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          # This checks MDF vs Prod and QA vs Prod
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{
              "stage": "post",
              "dev_mdb_id": "cloud-one-mdb-qa",
              "qa_mdb_id": "cloud-one-mdb-prod",
              "models_filter": $filters
            }')
          prefect deployment run 'check-promotion/check-promotion-upper' \
            --params "$PARAMS" \
            --watch

      - name: Check Sync — Confirm Stage and Production are in sync (Stage vs Prod)
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          set -xeuo pipefail
          # This checks MDF vs Prod and Stage vs Prod (using Stage as dev_mdb_id and Prod as qa_mdb_id)
          PARAMS=$(jq -n \
            --argjson filters '${{ needs.detect-updated-models.outputs.model_filters }}' \
            '{
              "stage": "post",
              "dev_mdb_id": "cloud-one-mdb-stage",
              "qa_mdb_id": "cloud-one-mdb-prod",
              "models_filter": $filters
            }')
          prefect deployment run 'check-promotion/check-promotion-upper' \
            --params "$PARAMS" \
            --watch

      # last_promoted_sha_stage_prod = SHA of the commit that last changed config/mdb_models.yml.
      # Used by detect-updated to find models whose latest_version changed since then.
      - name: Update last_promoted_sha_stage_prod in sync_status.yml
        run: |
          set -xeuo pipefail
          export NEW_SHA=$(git log -1 --format=%H -- config/mdb_models.yml)
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          python - << 'PY'
          import yaml, pathlib, os
          p = pathlib.Path('config/sync_status.yml')
          d = yaml.safe_load(p.read_text())
          d.setdefault('promotion', {})['last_promoted_sha_stage_prod'] = os.environ['NEW_SHA']
          p.write_text(yaml.dump(d, default_flow_style=False, sort_keys=False))
          PY
          git add config/sync_status.yml
          git diff --cached --quiet || git commit -m "chore: update last_promoted_sha_stage_prod to ${NEW_SHA}"
          git push origin ${{ github.ref_name }}

  slack-notification:
    needs: [detect-updated-models, check-qa-ready, export-c1-qa, import-to-c1-stage, prune-c1-stage, export-c1-stage, verify-stage-promotion, import-to-c1-prod, verify-prod-promotion]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: act10ns/slack@87c73aef9f8838eb6feae81589a6b1487a4a9e08  # v1.6.0
        with:
          status: ${{ (needs.detect-updated-models.result == 'failure' || needs.check-qa-ready.result == 'failure' || needs.export-c1-qa.result == 'failure' || needs.import-to-c1-stage.result == 'failure' || needs.prune-c1-stage.result == 'failure' || needs.export-c1-stage.result == 'failure' || needs.verify-stage-promotion.result == 'failure' || needs.import-to-c1-prod.result == 'failure' || needs.verify-prod-promotion.result == 'failure') && 'failure' || 'success' }}
          message: |
            <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Data Promotion: CloudOne QA → Stage → Production>
            ${{ (needs.detect-updated-models.result == 'failure' || needs.check-qa-ready.result == 'failure' || needs.export-c1-qa.result == 'failure' || needs.import-to-c1-stage.result == 'failure' || needs.verify-stage-promotion.result == 'failure' || needs.import-to-c1-prod.result == 'failure' || needs.verify-prod-promotion.result == 'failure') && 'Failure' || 'Success' }}
