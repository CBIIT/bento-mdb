name: Data Promotion (CloudOne QA to Stage and Production)

permissions:
  contents: write

on:
  schedule:
    - cron: "0 17 * * 6" # runs weekly on Saturday at 12:00 PM EST (17:00 UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Export s3 bucket only"
        required: false
        type: boolean
        default: false

jobs:
  detect-updated-models:
    runs-on: ubuntu-latest
    outputs:
      model_filters: ${{ steps.detect.outputs.model_filters }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: uv sync --all-extras

      # Uses last_promoted_sha_stage_prod from config/sync_status.yml.
      - name: Detect updated models since last promotion
        id: detect
        run: |
          set -euo pipefail
          ref=$(grep 'last_promoted_sha_stage_prod:' config/sync_status.yml | sed -E "s/.*last_promoted_sha_stage_prod: *['\"]?([a-f0-9]+)['\"]?.*/\1/" | tr -d ' \r' || true)
          echo "ref=$ref"
          if [ -z "$ref" ]; then
            echo "No last_promoted_sha_stage_prod found — setting model_filters=[] and skipping."
            echo "model_filters=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff=$(git diff "$ref..HEAD" -- config/mdb_models.yml 2>/dev/null || true)
          echo "diff length: ${#diff}"
          result=$(echo "$diff" | uv run python -c "import sys, json; from bento_mdb.promotion_detect import parse_diff; print(json.dumps({'model_filters': parse_diff(sys.stdin.read(), is_prod_release=True)}))")
          model_filters_val=$(echo "$result" | jq -c '.model_filters')
          echo "model_filters=$model_filters_val"
          echo "model_filters=$model_filters_val" >> "$GITHUB_OUTPUT"