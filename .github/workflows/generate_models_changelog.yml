name: Generate Model Changelogs

permissions:
  contents: read
  actions: write


on:
  workflow_call:
    inputs:
      models_spec_path:
        description: "Path to YAML files with models & refs their MDFs."
        required: false
        type: string
        default: "config/mdb_models.yml"
      model:
        description: "Specific model handle to process"
        required: false
        type: string
        default: ""
      version:
        description: "Specific version to process"
        required: false
        type: string
        default: ""
      mdf_files:
        description: "Path or URL to specific MDF files to process"
        required: false
        type: string
        default: ""
      datahub_only:
        description: "Only include datahub models"
        required: false
        type: boolean
        default: false
      mdb_id:
        description: "ID of MDB to update"
        required: false
        type: string
        default: "cloud-one-mdb-dev"
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false
    secrets:
      PREFECT_API_KEY:
        required: false
      PREFECT_API_URL:
        required: false
    outputs:
      changelog_files:
        description: "S3 keys of uploaded changelog files"
        value: ${{ jobs.upload-changelogs-s3.outputs.changelog_files }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mdb_models_changed: ${{ steps.filter.outputs.mdb_models }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          fetch-depth: 2

      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            mdb_models:
              - 'config/mdb_models.yml'
  generate-changelogs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Make Model Changelog
        run: |
          set -e

          mkdir -p data/output/model_changelogs/CDS/

          make_model_changelog \
          --model_handle "CDS" \
          --model_version "11.0.7" \
          --mdf_files "https://raw.githubusercontent.com/knockknockyoo/cds-model/11.0.7/model-desc/cds-model.yml" \
          --mdf_files "https://raw.githubusercontent.com/knockknockyoo/cds-model/11.0.7/model-desc/cds-model-props.yml" \
          --output_file_path "data/output/model_changelogs/CDS/CDS_changelog_11.0.7.xml" \
          --author "GitHub Actions" \
          --_commit "${{ github.sha }}" \
          --latest_version true \
          --add_rollback false

      - name: Get Model PVs and Synonyms
        if: false
        run: |
          set -e

          MDF_FILES_ARRAY=()
          if [ -n "${{ toJson(matrix.mdf_files) }}" ] && [ "${{ toJson(matrix.mdf_files) }}" != "null" ] && [ "${{ toJson(matrix.mdf_files) }}" != "[]" ]; then
            for file in $(echo '${{ toJson(matrix.mdf_files) }}' | jq -r '.[]'); do
              MDF_FILES_ARRAY+=("--mdf_files" "$file")
            done
          fi

          mkdir -p data/output/model_cde_pvs/${{ matrix.model }}/

          get_pvs_and_synonyms \
          --model_handle "${{ matrix.model }}" \
          --model_version "${{ matrix.version }}" \
          "${MDF_FILES_ARRAY[@]}"

      - name: Make Model CDE Changelog
        if: false
        run: |
          set -e

          make_model_cde_changelog \
          --model_handle "${{ matrix.model }}" \
          --model_version "${{ matrix.version }}" \
          --author "GitHub Actions" \
          --_commit "${{ github.sha }}"

      - name: Upload Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ matrix.model }}-${{ matrix.version }}
          path: |
            data/output/model_changelogs/${{ matrix.model }}/${{ matrix.model }}_changelog_${{ matrix.version }}.xml
            data/output/model_cde_pvs/${{ matrix.model }}/${{ matrix.model }}_${{ matrix.version }}_cdes.yml
            data/output/model_changelogs/${{ matrix.model }}/${{ matrix.model }}_${{ matrix.version }}_cde_changelog.xml
          retention-days: 1

      - name: Report Status
        if: false
        run: |
          echo "## Changelog Generation Status for ${{ matrix.model }} v${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Success**: Generated all changelog files" >> $GITHUB_STEP_SUMMARY
            echo "- Model changelog: ${{ matrix.model }}_changelog_${{ matrix.version }}.xml" >> $GITHUB_STEP_SUMMARY
            echo "- CDE PVs: ${{ matrix.model }}_${{ matrix.version }}_cdes.yml" >> $GITHUB_STEP_SUMMARY
            echo "- CDE changelog: ${{ matrix.model }}_${{ matrix.version }}_cde_changelog.xml" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failed**: Error generating changelog files" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for model ${{ matrix.model }} version ${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  upload-changelogs-s3:
    needs: [generate-changelogs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog_files: ${{ steps.upload.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Download changelog artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: changelog-*
        continue-on-error: true

      - name: Upload changelogs to S3 via Prefect flow
        id: upload
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          S3_KEYS="[]"
          HAS_FAILURE=false

          while IFS= read -r model_version; do
            IFS=':' read -r model version <<< "$model_version"

            for artifact_dir in changelog-*/; do
              for file in \
                "${artifact_dir}model_changelogs/${model}/${model}_changelog_${version}.xml" \
                "${artifact_dir}model_changelogs/${model}/${model}_${version}_cde_changelog.xml"; do
                if [ -f "$file" ]; then
                  S3_KEY="model_changelogs/${model}/$(basename "$file")"
                  CONTENT=$(cat "$file")

                  PARAMS=$(jq -n \
                    --arg key "$S3_KEY" \
                    --arg content "$CONTENT" \
                    '{"s3_key": $key, "changelog_content": $content}')

                  DEPLOY_OUTPUT=$(prefect deployment run upload-changelog-s3/upload-changelog-s3 --params "$PARAMS" --watch 2>&1)
                  echo "$DEPLOY_OUTPUT"

                  if echo "$DEPLOY_OUTPUT" | grep -q "Completed"; then
                    echo "Uploaded: $S3_KEY"
                    S3_KEYS=$(echo "$S3_KEYS" | jq --arg k "$S3_KEY" '. + [$k]')
                  else
                    echo "ERROR: Failed to upload $S3_KEY"
                    HAS_FAILURE=true
                  fi
                fi
              done
            done
          done < <(echo '{"include":[{"model":"CDS","version":"11.0.7"}]}' | jq -r '.include[] | "\(.model):\(.version)"')

          if [ "$HAS_FAILURE" = true ]; then
            echo "One or more uploads failed."
            exit 1
          fi

          echo "changelog_files=$(echo $S3_KEYS | jq -c .)" >> $GITHUB_OUTPUT
          echo "Uploaded S3 keys: $(echo $S3_KEYS | jq .)"

      - name: Commit S3 upload log to git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          S3_KEYS='${{ steps.upload.outputs.changelog_files }}'
          COMMIT_MSG="s3-upload-log run=${RUN_ID} keys=${S3_KEYS}"

          git commit --allow-empty -m "$COMMIT_MSG"
          git push origin ${{ github.ref_name }}