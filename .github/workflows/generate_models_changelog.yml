name: Generate Model Changelogs

permissions:
  contents: read
  actions: write


on:
  workflow_call:
    inputs:
      models_spec_path:
        description: "Path to YAML files with models & refs their MDFs."
        required: false
        type: string
        default: "config/mdb_models.yml"
      model:
        description: "Specific model handle to process"
        required: false
        type: string
        default: ""
      version:
        description: "Specific version to process"
        required: false
        type: string
        default: ""
      mdf_files:
        description: "Path or URL to specific MDF files to process"
        required: false
        type: string
        default: ""
      datahub_only:
        description: "Only include datahub models"
        required: false
        type: boolean
        default: false
      mdb_id:
        description: "ID of MDB to update"
        required: false
        type: string
        default: "cloud-one-mdb-dev"
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false
    secrets:
      PREFECT_API_KEY:
        required: false
      PREFECT_API_URL:
        required: false
    outputs:
      changelog_files:
        description: "S3 keys of uploaded changelog files"
        value: ${{ jobs.upload-changelogs-s3.outputs.changelog_files }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mdb_models_changed: ${{ steps.filter.outputs.mdb_models }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v4
        with:
          fetch-depth: 2

      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            mdb_models:
              - 'config/mdb_models.yml'
  determine-models:
    needs: changes
    if: ${{ needs.changes.outputs.mdb_models_changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    outputs:
      affected_models: ${{ steps.set-matrix.outputs.model_matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Generate Model Version Matrix
        id: set-matrix
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
        run: |
          set -xeuo pipefail
          trap 'echo "Error in $BASH_COMMAND at line $LINENO (exit code $?)"' ERR

          # Use provided MDB ID or default to cloud-one-mdb-dev
          MDB_ID="${{ inputs.mdb_id || 'cloud-one-mdb-dev' }}"
          
          # Generate matrix for database
          PARAMS='{"mdb_id": "cloud-one-mdb-dev", "model_specs_yaml": "config/mdb_models.yml", "datahub_only": false}'

          echo "Running Prefect deployment with params: $PARAMS"

          watch_out=$(
            prefect deployment run generate-model-version-matrix/generate-model-version-matrix \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee watch.log
          )
          echo "watch_out=$watch_out"

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" watch.log \
            | head -n1
          )
          echo "Run ID: $RUN_ID"

          echo "Waiting for logs to be available..."
          sleep 10

          LOG_FILE="${RUN_ID}_run.log"
          prefect flow-run logs "$RUN_ID" > "$LOG_FILE"

          echo "Checking for MATRIX_JSON in logs:"
          grep -a "MATRIX_JSON" "$LOG_FILE" || echo "No MATRIX_JSON found in logs"

          MATRIX_OUTPUT=$(grep -a -m1 "MATRIX_JSON:" "$LOG_FILE" \
            | grep -oP 'MATRIX_JSON:\K\{.*\}' \
            || echo "")

          if [ -n "$MATRIX_OUTPUT" ]; then
            echo "$MATRIX_OUTPUT" > matrix.json
            echo "Matrix extracted successfully"
          else
            echo "Warning: Could not extract matrix from deployment output"
            echo "{\"include\": []}" > matrix.json
          fi

          # validate json
          if ! jq . matrix.json > /dev/null 2>&1; then
            echo "Error: Invalid JSON in matrix.json"
            exit 1
          fi

          MATRIX=$(cat matrix.json)
          MATRIX_COMPACT=$(echo "$MATRIX" | jq -c .)
          
          echo "model_matrix=$MATRIX_COMPACT" >> $GITHUB_OUTPUT
          echo "Matrix: $MATRIX"

  generate-changelogs:
    needs: determine-models
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.determine-models.outputs.affected_models) }}
      fail-fast: false
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Make Model Changelog
        run: |
          set -e

          MDF_FILES_ARRAY=()
          if [ -n "${{ toJson(matrix.mdf_files) }}" ] && [ "${{ toJson(matrix.mdf_files) }}" != "null" ] && [ "${{ toJson(matrix.mdf_files) }}" != "[]" ]; then
            for file in $(echo '${{ toJson(matrix.mdf_files) }}' | jq -r '.[]'); do
              MDF_FILES_ARRAY+=("--mdf_files" "$file")
            done
          fi

          mkdir -p data/output/model_changelogs/${{ matrix.model }}/

          make_model_changelog \
          --model_handle "${{ matrix.model }}" \
          --model_version "${{ matrix.version }}" \
          "${MDF_FILES_ARRAY[@]}" \
          --output_file_path "data/output/model_changelogs/${{ matrix.model }}/${{ matrix.model }}_changelog_${{ matrix.version }}.xml" \
          --author "GitHub Actions" \
          --_commit "${{ github.sha }}" \
          --latest_version ${{ fromJson('true') }} \
          --add_rollback ${{ fromJson('false') }}

      - name: Get Model PVs and Synonyms
        run: |
          set -e

          MDF_FILES_ARRAY=()
          if [ -n "${{ toJson(matrix.mdf_files) }}" ] && [ "${{ toJson(matrix.mdf_files) }}" != "null" ] && [ "${{ toJson(matrix.mdf_files) }}" != "[]" ]; then
            for file in $(echo '${{ toJson(matrix.mdf_files) }}' | jq -r '.[]'); do
              MDF_FILES_ARRAY+=("--mdf_files" "$file")
            done
          fi

          mkdir -p data/output/model_cde_pvs/${{ matrix.model }}/

          get_pvs_and_synonyms \
          --model_handle "${{ matrix.model }}" \
          --model_version "${{ matrix.version }}" \
          "${MDF_FILES_ARRAY[@]}"

      - name: Make Model CDE Changelog
        run: |
          set -e

          make_model_cde_changelog \
          --model_handle "${{ matrix.model }}" \
          --model_version "${{ matrix.version }}" \
          --author "GitHub Actions" \
          --_commit "${{ github.sha }}"

      - name: Upload Generated Files
        uses: actions/upload-artifact@v4
        with:
          name: changelog-${{ matrix.model }}-${{ matrix.version }}
          path: |
            data/output/model_changelogs/${{ matrix.model }}/${{ matrix.model }}_changelog_${{ matrix.version }}.xml
            data/output/model_cde_pvs/${{ matrix.model }}/${{ matrix.model }}_${{ matrix.version }}_cdes.yml
            data/output/model_changelogs/${{ matrix.model }}/${{ matrix.model }}_${{ matrix.version }}_cde_changelog.xml
          retention-days: 1

      - name: Report Status
        if: always()
        run: |
          echo "## Changelog Generation Status for ${{ matrix.model }} v${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Success**: Generated all changelog files" >> $GITHUB_STEP_SUMMARY
            echo "- Model changelog: ${{ matrix.model }}_changelog_${{ matrix.version }}.xml" >> $GITHUB_STEP_SUMMARY
            echo "- CDE PVs: ${{ matrix.model }}_${{ matrix.version }}_cdes.yml" >> $GITHUB_STEP_SUMMARY
            echo "- CDE changelog: ${{ matrix.model }}_${{ matrix.version }}_cde_changelog.xml" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Failed**: Error generating changelog files" >> $GITHUB_STEP_SUMMARY
            echo "Please check the logs for model ${{ matrix.model }} version ${{ matrix.version }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

  upload-changelogs-s3:
    needs: [determine-models, generate-changelogs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changelog_files: ${{ steps.upload.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Install Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev

      - name: Download changelog artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: changelog-*
        continue-on-error: true

      - name: Upload changelogs to S3 via Prefect flow
        id: upload
        shell: bash
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL_C1 }}
        run: |
          S3_KEYS="[]"
          HAS_FAILURE=false

          while IFS= read -r file; do
            S3_KEY=$(echo "$file" | sed 's|^changelog-[^/]*/||')
            echo "Processing: $S3_KEY"

            # Compute SHA256 hash of the file (base64-encoded, required by S3 checksum)
            SHA256_BASE64=$(sha256sum "$file" | cut -d' ' -f1 | xxd -r -p | base64 -w0)

            # Request a SHA256-locked presigned PUT URL from Prefect (only s3_key + sha256 passed, no file content)
            PARAMS=$(jq -n \
              --arg key "$S3_KEY" \
              --arg sha256 "$SHA256_BASE64" \
              '{"s3_key": $key, "sha256_base64": $sha256}')

            LOG_FILE=$(mktemp /tmp/prefect_log_XXXXXX.txt)
            DEPLOY_OUTPUT=$(prefect deployment run \
              generate-changelog-presigned-url/generate-changelog-presigned-url \
              --params "$PARAMS" --watch 2>&1 | tee "$LOG_FILE")

            RUN_ID=$(grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" "$LOG_FILE" | head -n1)
            sleep 5
            prefect flow-run logs "$RUN_ID" >> "$LOG_FILE" 2>&1

            # Extract presigned URL from Prefect flow logs
            PRESIGNED_URL=$(grep -oP 'PRESIGNED_URL:\K.*' "$LOG_FILE" | tail -n1 | tr -d '[:space:]')
            rm -f "$LOG_FILE"

            if [ -z "$PRESIGNED_URL" ]; then
              echo "ERROR: Could not get presigned URL for $S3_KEY"
              HAS_FAILURE=true
              continue
            fi

            # Mask the presigned URL from GitHub Actions logs
            echo "::add-mask::$PRESIGNED_URL"

            # Upload directly to S3 with SHA256 checksum header (S3 rejects if hash does not match)
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -X PUT \
              -H "Content-Type: application/xml" \
              -H "x-amz-checksum-sha256: $SHA256_BASE64" \
              --upload-file "$file" \
              "$PRESIGNED_URL")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Uploaded: $S3_KEY"
              S3_KEYS=$(echo "$S3_KEYS" | jq --arg k "$S3_KEY" '. + [$k]')
            else
              echo "ERROR: Upload failed for $S3_KEY (HTTP $HTTP_STATUS)"
              HAS_FAILURE=true
            fi
          done < <(find changelog-*/model_changelogs -name "*.xml" 2>/dev/null)

          if [ "$HAS_FAILURE" = true ]; then
            echo "One or more uploads failed."
            exit 1
          fi

          echo "changelog_files=$(echo $S3_KEYS | jq -c .)" >> $GITHUB_OUTPUT
          echo "Uploaded S3 keys: $(echo $S3_KEYS | jq .)"

      - name: Commit S3 upload log to git
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          S3_KEYS='${{ steps.upload.outputs.changelog_files }}'
          COMMIT_MSG="s3-upload-log run=${RUN_ID} keys=${S3_KEYS}"

          git commit --allow-empty -m "$COMMIT_MSG"
          git push origin ${{ github.ref_name }}