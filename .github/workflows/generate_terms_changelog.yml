name: Generate Term Changelogs
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      author:
        description: "Author name for changes"
        required: false
        type: string
        default: "GitHub Actions"
      commit_sha:
        description: "Commit SHA for reference"
        required: false
        type: string
        default: ""
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false
    secrets:
      PREFECT_API_KEY:
        required: false
      PREFECT_API_URL:
        required: false
    outputs:
      changelog_files:
        description: "Generated changelog files"
        value: ${{ jobs.update-mdb-terms.outputs.changelog_files }}

jobs:
  update-mdb-terms:
    runs-on: ubuntu-latest
    outputs:
      changelog_files: ${{ steps.update-terms.outputs.changelog_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      # TODO: Replace this fake changelog block with the real Prefect flow
      - name: Generate fake term changelog for testing
        id: update-terms
        run: |
          set -euo pipefail

          MDB_ID="cloud-one-mdb-dev"
          TODAY=$(date +%Y%m%d)
          CHANGELOG_DIR="data/output/term_changelogs"
          CHANGELOG_FILE="${CHANGELOG_DIR}/${MDB_ID}_${TODAY}_term_updates.xml"

          mkdir -p "$CHANGELOG_DIR"

          cat > "$CHANGELOG_FILE" <<'XMLEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <databaseChangeLog xmlns="http://www.liquibase.org/xml/ns/dbchangelog">
            <!-- Fake changelog for trigger testing -->
            <changeSet id="test-term-update" author="GitHub Actions Bot">
              <comment>Test term changelog generated for workflow trigger testing</comment>
            </changeSet>
          </databaseChangeLog>
          XMLEOF

          echo "Created fake changelog: $CHANGELOG_FILE"

          RESULT_JSON=$(jq -nc --arg p "$CHANGELOG_FILE" '[ $p ]')
          echo "changelog_files=$RESULT_JSON" >> $GITHUB_OUTPUT
          echo "Changelog files: $RESULT_JSON"

      - name: Commit fake changelog
        if: ${{ !fromJson(inputs.no_commit || 'false') }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          git add data/output/term_changelogs/

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Add fake term changelog for testing

          Generated by workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push origin ${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
