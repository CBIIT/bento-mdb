name: Generate Term Changelogs
permissions:
  contents: write
  actions: write
  id-token: write

on:
  workflow_call:
    inputs:
      author:
        description: "Author name for changes"
        required: false
        type: string
        default: "GitHub Actions"
      commit_sha:
        description: "Commit SHA for reference"
        required: false
        type: string
        default: ""
      log_level:
        description: "Log level"
        required: false
        type: string
        default: "info"
      dry_run:
        description: "Dry run flag"
        required: false
        type: boolean
        default: false
      no_commit:
        description: "Don't commit changes to GitHub."
        required: false
        type: boolean
        default: false
    secrets:
      PREFECT_API_KEY:
        required: false
      PREFECT_API_URL:
        required: false
      AWS_CHANGELOG_ROLE_ARN:
        required: false
      AWS_REGION:
        required: false
      S3_CHANGELOG_BUCKET:
        required: false
    outputs:
      changelog_files:
        description: "S3 keys of uploaded changelog files"
        value: ${{ jobs.update-mdb-terms.outputs.changelog_files }}

jobs:
  update-mdb-terms:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_CHANGELOG_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_CHANGELOG_BUCKET }}
    outputs:
      changelog_files: ${{ steps.upload-s3.outputs.s3_keys }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: "0.5.10"

      - name: Install dependencies and project
        run: |
          uv pip install --system -e .
          uv sync --all-extras --dev
      
      - name: Update terms
        id: update-terms
        env:
          PREFECT_API_KEY: ${{ secrets.PREFECT_API_KEY }}
          PREFECT_API_URL: ${{ secrets.PREFECT_API_URL }}
          MDB_ID: cloud-one-mdb-dev
        run: |
          set -xeuo pipefail
          trap 'echo "Error in $BASH_COMMAND at line $LINENO (exit code $?)"' ERR

          PARAMS=$(jq -n \
          --arg mdb_id "$MDB_ID" \
          --arg author "${{ inputs.author || 'GitHub Actions Bot' }}" \
          --arg commit "${{ inputs.commit_sha || github.sha }}" \
          --argjson no_commit "${{ inputs.no_commit || false }}" \
          '{
            "mdb_id": $mdb_id,
            "author": $author,
            "commit": $commit,
            "no_commit": $no_commit
          }')
          echo "PARAMS=$PARAMS"

          watch_out=$(
            prefect deployment run update-terms/update-terms \
              --params "$PARAMS" \
              --watch \
              --watch-interval 30 2>&1 | tee watch.log
          )
          echo "watch_out=$watch_out"

          RUN_ID=$(
            grep -oP "(?<=UUID:\s)[0-9a-fA-F-]+" watch.log \
            | head -n1
          )
          echo "Scheduled and completed run: $RUN_ID"
          
          LOG_FILE="${RUN_ID}_run.log"
          echo "Log file: $LOG_FILE"

          prefect flow-run logs "$RUN_ID" > "$LOG_FILE"

          echo "First 10 lines of log file:"
          head -n 10 "$LOG_FILE" || echo "Failed to read log file"
          
          echo "Checking for RESULT_JSON in logs:"
          grep -a "RESULT_JSON" "$LOG_FILE" || echo "No RESULT_JSON found in logs"

          RESULT_JSON='[]'
          
          RAW_JSON=$(grep -a -m1 "RESULT_JSON:" "$LOG_FILE" \
            | grep -oP 'RESULT_JSON:\s*\[.*\]' \
            | sed 's/RESULT_JSON:\s*//' \
            || echo '[]')
          echo "Raw JSON array from logs: $RAW_JSON"

          FIRST_PATH=$(echo "$RAW_JSON" | jq -r '.[0] // empty')
          if [ -n "$FIRST_PATH" ]; then
            CLEAN_PATH=$(echo "$FIRST_PATH" \
              | sed -E 's|.*/data/|data/|')
            RESULT_JSON=$(jq -nc --arg p "$CLEAN_PATH" '[ $p ]')
            echo "Normalized RESULT_JSON: $RESULT_JSON"
          fi

          if [ -z "${RESULT_JSON//\[\]/}" ]; then
            echo "Fallback: no direct JSON, grepping for filename…"
            FILE_PATH=$(grep -a -o '/[^ ]*/output/term_changelogs/[^ ]*_term_updates\.xml' "$LOG_FILE" \
              | tail -n1 \
              || true)
            if [ -n "$FILE_PATH" ]; then
              STRIPPED=${FILE_PATH#*/data/}               # e.g. output/term_changelogs/xxx.xml
              RESULT_JSON=$(jq -nc --arg p "data/$STRIPPED" '[ $p ]')
              echo "Fallback RESULT_JSON: $RESULT_JSON"
            fi
          fi

          echo "local_changelog_files=$RESULT_JSON" >> $GITHUB_OUTPUT
          echo "Changelog files for $MDB_ID: $RESULT_JSON"

      - name: Pull latest changes
        if: ${{ steps.update-terms.outputs.local_changelog_files != '[]' && steps.update-terms.outputs.local_changelog_files != '' }}
        run: git pull origin ${{ github.ref_name }}

      - name: AWS OIDC Authentication
        if: ${{ steps.update-terms.outputs.local_changelog_files != '[]' && steps.update-terms.outputs.local_changelog_files != '' }}
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502  # v4.0.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: ${{ github.actor }}

      - name: Upload changelogs to S3
        id: upload-s3
        if: ${{ steps.update-terms.outputs.local_changelog_files != '[]' && steps.update-terms.outputs.local_changelog_files != '' }}
        env:
          LOCAL_FILES: ${{ steps.update-terms.outputs.local_changelog_files }}
        run: |
          S3_KEYS="[]"
          HAS_FAILURE=false

          for file in $(echo "$LOCAL_FILES" | jq -r '.[]'); do
            S3_KEY=$(echo "$file" | sed 's|.*term_changelogs/|term_changelogs/|')
            echo "Uploading $file -> s3://${S3_BUCKET}/${S3_KEY}"
            if aws s3 cp "$file" "s3://${S3_BUCKET}/${S3_KEY}" --content-type application/xml; then
              echo "Uploaded: $S3_KEY"
              S3_KEYS=$(echo "$S3_KEYS" | jq --arg k "$S3_KEY" '. + [$k]')
            else
              echo "ERROR: Failed to upload $S3_KEY"
              HAS_FAILURE=true
            fi
          done

          if [ "$HAS_FAILURE" = true ]; then
            echo "One or more uploads failed."
            exit 1
          fi

          echo "s3_keys=$(echo $S3_KEYS | jq -c .)" >> $GITHUB_OUTPUT
          echo "S3 keys: $(echo $S3_KEYS | jq .)"

      - name: Commit S3 upload log to git
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          S3_KEYS='${{ steps.upload-s3.outputs.s3_keys }}'

          if [ -z "$S3_KEYS" ] || [ "$S3_KEYS" = "[]" ] || [ "$S3_KEYS" = "null" ]; then
            echo "No files uploaded. Skipping commit."
            exit 0
          fi

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
 
          COMMIT_MSG="s3-upload-log run=${RUN_ID} keys=${S3_KEYS}"
          git commit --allow-empty -m "$COMMIT_MSG"
          git push origin ${{ github.ref_name }}
