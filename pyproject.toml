[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bento-mdb"
version = "0.1.0"
description = "Tools for updating MDB"
authors = [{name="Nelson Moore", email="nelson.moore@essential-soft.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bento-mdf==0.11.11",
    "bento-meta==0.2.19",
    "boto3>=1.38.36",
    "click>=8.1.8",
    "liquichange>=0.2.1",
    "minicypher>=0.1.1",
    "neo4j>=4.4,<6.0",
    "packaging>=24.2",
    "prefect==3.3.4",
    "prefect-shell>=0.3.1",
    "pygithub>=2.6.1",
    "pyliquibase>=2.4.0",
    "pytest>=8.3.4",
    "stamina>=24.3.0",
]

[project.scripts]
check_new_mdfs = "scripts.check_new_mdfs:main"
check_promotion = "scripts.check_promotion:main"
get_pvs_and_synonyms = "scripts.get_pvs_and_synonyms:main"
make_model_cde_changelog = "scripts.make_model_cde_changelog:main"
make_model_changelog = "scripts.make_model_changelog:main"
renumber_changelog = "scripts.renumber_changelog:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bento_mdb", "scripts"]

[dependency-groups]
dev = [
    "docker>=7.1.0",
    "pytest-cov>=6.0.0",
    "pytest>=8.3.4",
    "testcontainers>=4.9.2",
    "pytest-docker>=3.2.1",
    "pytest-docker-tools>=3.1.9",
    "prefect-docker>=0.6.2",
]

[tool.pytest.ini_options]
markers = [
    "docker: marks tests that require docker",
]

[tool.uv]
package = true
