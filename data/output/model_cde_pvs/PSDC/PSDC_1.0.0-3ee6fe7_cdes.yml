      origin_definition: A specially trained physician with expertise in the application
        of bronchoscopic techniques for diagnostic and treatment purposes. Types of
        procedures and interventions performed by a bronchoscopist include, but are
        not limited to, evaluation of the air passages of the lung (e.g. localization
