  - value: Audiologist
    origin_version: '1'
    origin_id: '2576279'
    origin_definition: A trained non-medical health professional who specializes in
      the identification, testing, habilitation and rehabilitation of hearing loss
      and other auditory and balance disorders. Particularly, an audiologist may be
      involved in diagnostic and screening procedures to determine hearing deficits,
      as well as in assessment of amplification devices and instruction in their care,
      training in speechreading, and may serve as consultant to government and industry
      on issues concerning environmental, noise-induced hearing loss. Certification
      requirements for clinical audiology professional are currently defined at a
      single level - Certificate of Clinical Competency.
    origin_name: caDSR
    ncit_concept_codes:
