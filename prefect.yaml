# this yaml file is meant to configure deployment parameters for external ontology ingestion pipelines
name: bento-mdb-external-ingestion
prefect-version: 3.4.25

build: null
push: null
pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/CBIIT/bento-mdb.git
    branch: uberon-update
- prefect.deployments.steps.run_shell_script:
    id: install-dependencies
    script: sh -c "cd bento-mdb-uberon-update && uv pip install --system ."

# these deployments are for external ontology ingestion workflows (uberon, obib, icdo)
deployments:
- name: uberon-relationships
  version: null
  tags: []
  concurrency_limit: null
  description: |-
    Wrapper flow to:
    1. Split large changelog into smaller chunks
    2. Run existing liquibase_update_flow on each chunk sequentially

    Designed to minimize changes to existing logic while improving performance and logging.
  entrypoint: src/bento_mdb/flows/update_mdb.py:liquibase_ingestion_flow
  parameters: {
    "changelog_file": "data/uberon/insert_uberon_relationships.xml",
    "mdb_id": "fnl-mdb-qa",
    "max_changesets": 5,
    "dry_run": false
  }
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: null
    job_variables: {}
  schedules: []

- name: uberon-valueset-mapping
  version: null
  tags: []
  concurrency_limit:
  description: Create valueset for uberon terms and attach with original CDEs that reference Uberon by URL
  entrypoint: src/bento_mdb/flows/update_mdb.py:liquibase_ingestion_flow
  parameters: {
    "changelog_file": "data/uberon/cde_valueset_integration.xml",
    "mdb_id": "fnl-mdb-qa",
    "max_changesets": 1,
    "dry_run": false
  }
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: null
    job_variables: {}
  schedules: []

- name: obib_data_ingestion
  version: null
  tags: []
  concurrency_limit:
  description: Ingest term nodes from the official OBIB dataset 
  entrypoint: src/bento_mdb/flows/update_mdb.py:liquibase_ingestion_flow
  parameters: {
    "changelog_file": "data/obib/01_batch_insert_obib_terms.xml",
    "mdb_id": "fnl-mdb-qa",
    "max_changesets": 5,
    "dry_run": false
  }
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: null
    job_variables: {}
  schedules: []