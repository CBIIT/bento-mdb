# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: bento-mdb-external-ingestion
prefect-version: 3.4.25

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations
pull:
- prefect.deployments.steps.git_clone:
    id: clone-step
    repository: https://github.com/CBIIT/bento-mdb.git
    branch: uberon-update
- prefect.deployments.steps.run_shell_script:
    id: install-dependencies
    script: sh -c "cd bento-mdb-uberon-update && uv pip install --system ."

# the deployments section allows you to provide configuration for deploying flows
deployments:
- name: uberon-relationships
  version: null
  tags: []
  concurrency_limit: null
  description: |-
    Wrapper flow to:
    1. Split large changelog into smaller chunks
    2. Run existing liquibase_update_flow on each chunk sequentially

    Designed to minimize changes to existing logic while improving performance and logging.
  entrypoint: src/bento_mdb/flows/update_mdb.py:liquibase_ingestion_flow
  parameters: {
    "changelog_file": "data/uberon/insert_uberon_relationships.xml",
    "mdb_id": "fnl-mdb-qa",
    "max_changesets": 5,
    "dry_run": false
  }
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: null
    job_variables: {}
  schedules: []

- name: uberon-valueset-mapping
  version: null
  tags: []
  concurrency_limit:
  description: Create valueset for uberon terms and attach with original CDEs that reference Uberon by URL
  entrypoint: bento_mdb.flows.update_mdb:liquibase_ingestion_flow
  parameters: {
    "changelog_file": "data/uberon/cde_valueset_integration.xml"
    "mdb_id": "fnl-mdb-qa"
    "max_changesets": 1   
    "dry_run": false
  }
  work_pool:
    name: fnl-mdb-8gb-prefect-2.20.3-python3.9
    work_queue_name: null
    job_variables: {}
  schedules: []
